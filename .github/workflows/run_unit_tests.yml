name: Run Unit Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            changed_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "src/ tests/")
          fi

          if echo "$changed_files" | grep -qE '^(src/|tests/|pyproject\.toml|uv\.lock)'; then
            echo "run_tests=true" >> $GITHUB_OUTPUT
            echo "Tests will run - relevant files changed"
          else
            echo "run_tests=false" >> $GITHUB_OUTPUT
            echo "Tests skipped - no relevant files changed"
          fi

      - name: Install uv
        if: steps.changes.outputs.run_tests == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.changes.outputs.run_tests == 'true'
        run: uv python install

      - name: Install dependencies
        if: steps.changes.outputs.run_tests == 'true'
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        if: steps.changes.outputs.run_tests == 'true'
        run: uv run pytest tests/

      - name: Run Ruff lint checks
        if: steps.changes.outputs.run_tests == 'true'
        run: uv run ruff check .
